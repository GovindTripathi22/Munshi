name: Munshi CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Verify Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Run Forensic Benchmark Suite
        run: |
          python -m munshi.cli benchmark

      - name: Verify Cryptographic Audit Trail & Database
        run: |
          python -m munshi.cli verify

  docker-smoke-test:
    name: Docker Build & Health Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t munshi-app:ci .

      - name: Run Container & Verify Health Endpoint
        run: |
          docker run -d --name munshi-ci-test -p 8000:8000 munshi-app:ci
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop munshi-ci-test
