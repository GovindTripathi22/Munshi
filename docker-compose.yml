version: '3.8'

services:
  munshi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: munshi-os
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONIOENCODING=utf-8
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MUNSHI_MODEL=gemini-2.5-flash
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
