<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Munshi: Autonomous AI Bookkeeper & Forensic Audit OS</title>
  <meta name="description" content="Autonomous Multi-Agent AI Financial Assistant & Forensic Auditor with Double-Entry Ledger, Indian GST Rules, SHA-256 Audit Trail, and LangGraph" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='m16 12-4-4-4 4'/><path d='M12 16V8'/></svg>" />

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              900: '#064e3b',
              950: '#022c22',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #070b12;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    /* Custom sleek scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b111e;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    .loading-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
  </style>
</head>
<body class="bg-[#070b12] text-slate-100 min-h-screen">
  <div id="root">
    <!-- Initial Splash / Fallback Loader -->
    <div id="loader" class="min-h-screen flex flex-col items-center justify-center bg-[#070b12] text-white p-6">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 via-teal-500 to-indigo-600 p-0.5 shadow-xl shadow-emerald-500/20 loading-pulse mb-4">
        <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
          <svg class="w-8 h-8 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
            <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
            <path d="M7 21h10"/>
            <path d="M12 3v18"/>
            <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>
          </svg>
        </div>
      </div>
      <h1 class="text-xl font-extrabold text-white tracking-tight">MUNSHI (मुंशी) AI</h1>
      <p class="text-xs text-slate-400 mt-1">Initializing Double-Entry Ledger & LangGraph Multi-Agent Engine...</p>
      <div class="w-48 h-1 bg-slate-800 rounded-full overflow-hidden mt-4">
        <div class="h-full bg-emerald-500 rounded-full animate-[progress_1.5s_ease-in-out_infinite]" style="width: 60%"></div>
      </div>
    </div>
  </div>

  <!-- Vite entrypoint -->
  <script type="module" src="./main.tsx"></script>
</body>
</html>
